<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post · Guilherme Olímpio Fagundes</title>
  <!-- marked.js: Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; color: #222; background: #fff; line-height: 1.6; }
    header { max-width: 800px; margin: 3rem auto 2rem; padding: 0 1rem; }
    header h1 { margin-bottom: 0.2rem; }
    header p  { margin-top: 0; color: #555; }
    nav { margin-top: 1rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #0055aa; }
    nav a:hover { text-decoration: underline; }
    nav a.active { font-weight: 600; border-bottom: 2px solid #0055aa; }
    main { max-width: 800px; margin: 0 auto; padding: 0 1rem 4rem; }
    footer { max-width: 800px; margin: 2rem auto; padding: 0 1rem; font-size: 0.9rem; color: #666; }

    /* ── Post header ── */
    #post-header { margin-bottom: 2rem; padding-bottom: 1.2rem; border-bottom: 1px solid #eee; }
    #post-header h1 { font-size: 1.6rem; margin: 0.4rem 0 0.5rem; line-height: 1.3; }
    .post-meta-bar {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.82rem;
      color: #999;
    }
    .post-category {
      display: inline-block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.1rem 0.5rem;
      border-radius: 3px;
      font-weight: 600;
    }
    .cat-pesquisa  { background: #e8f0fb; color: #0055aa; }
    .cat-resenha   { background: #fce8e8; color: #c62828; }
    .cat-tutorial  { background: #e8f5e9; color: #2e7d32; }
    .cat-ensaio    { background: #fff3e0; color: #e65100; }

    /* ── Post body (Markdown rendered) ── */
    #post-body { font-size: 1rem; line-height: 1.75; }
    #post-body h1 { font-size: 1.5rem; margin-top: 2rem; }
    #post-body h2 { font-size: 1.2rem; margin-top: 2rem; border-bottom: 1px solid #eee; padding-bottom: 0.3rem; }
    #post-body h3 { font-size: 1.05rem; margin-top: 1.5rem; }
    #post-body p  { margin: 0 0 1rem; }
    #post-body a  { color: #0055aa; }
    #post-body blockquote {
      margin: 1.2rem 0;
      padding: 0.6rem 1rem;
      border-left: 3px solid #ddd;
      color: #555;
      background: #fafafa;
    }
    #post-body code {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.88em;
      background: #f4f4f4;
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }
    #post-body pre {
      background: #f4f4f4;
      border-radius: 4px;
      padding: 1rem 1.2rem;
      overflow-x: auto;
      font-size: 0.88rem;
      line-height: 1.6;
    }
    #post-body pre code { background: none; padding: 0; }
    #post-body ul, #post-body ol { padding-left: 1.6rem; margin: 0 0 1rem; }
    #post-body li { margin-bottom: 0.3rem; }
    #post-body hr { border: none; border-top: 1px solid #eee; margin: 2rem 0; }
    #post-body strong { font-weight: 600; }
    #post-body em { font-style: italic; }
    #post-body img { max-width: 100%; border-radius: 4px; margin: 1rem 0; }
    #post-body table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.93rem; }
    #post-body th, #post-body td { border: 1px solid #ddd; padding: 0.45rem 0.7rem; text-align: left; }
    #post-body th { background: #f8f8f8; font-weight: 600; }

    /* ── Back link ── */
    #back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.88rem;
      color: #0055aa;
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    #back-link:hover { text-decoration: underline; }

    /* ── Loading / error states ── */
    #loading { color: #999; font-size: 0.95rem; }
    #error   { color: #c00; font-size: 0.95rem; }
  </style>
</head>
<body>

<header>
  <h1><a href="index.html" style="text-decoration:none;color:inherit;">Guilherme Olímpio Fagundes</a></h1>
  <p>Mestrando pelo Programa de Pós-Graduação em Sociologia da Universidade de São Paulo</p>
  <nav>
    <a href="index.html">Início</a>
    <a href="index.html#research">Pesquisas</a>
    <a href="index.html#publications">Publicações</a>
    <a href="index.html#events">Eventos</a>
    <a href="blog.html" class="active">Blog</a>
    <a href="index.html#cv">CV</a>
    <a href="index.html#contact">Contato</a>
  </nav>
</header>

<main>
  <a href="blog.html" id="back-link">← Voltar ao blog</a>

  <div id="loading">Carregando post…</div>
  <div id="error"   style="display:none"></div>

  <article>
    <div id="post-header" style="display:none">
      <div class="post-meta-bar">
        <span id="post-date"></span>
        <span id="post-cat" class="post-category"></span>
      </div>
      <h1 id="post-title"></h1>
    </div>
    <div id="post-body"></div>
  </article>
</main>

<footer><p>© 2026 Guilherme Olímpio Fagundes · <a href="blog.html">Blog</a></p></footer>

<script>
(async function () {

  const LABELS = { pesquisa: "Pesquisa", resenha: "Resenha", tutorial: "Tutorial", ensaio: "Ensaio" };

  function fmtDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const months = ["jan.","fev.","mar.","abr.","mai.","jun.","jul.","ago.","set.","out.","nov.","dez."];
    return `${d} ${months[m-1]} ${y}`;
  }

  function showError(msg) {
    document.getElementById("loading").style.display = "none";
    const el = document.getElementById("error");
    el.style.display = "block";
    el.textContent = msg;
  }

  // Read ?slug= from URL
  const params = new URLSearchParams(window.location.search);
  const slug   = params.get("slug");
  if (!slug) { showError("Nenhum post especificado."); return; }

  // Load posts index to get metadata
  let meta = null;
  try {
    const res = await fetch("posts/posts.json");
    const all = await res.json();
    meta = all.find(p => p.slug === slug);
  } catch(e) {
    showError("Não foi possível carregar o índice de posts.");
    return;
  }
  if (!meta) { showError(`Post "${slug}" não encontrado no índice.`); return; }

  // Update page title
  document.title = `${meta.title} · Guilherme Olímpio Fagundes`;

  // Fill header
  document.getElementById("post-date").textContent = fmtDate(meta.date);
  const catEl = document.getElementById("post-cat");
  catEl.textContent  = LABELS[meta.category] || meta.category;
  catEl.className    = `post-category cat-${meta.category}`;
  document.getElementById("post-title").textContent = meta.title;
  document.getElementById("post-header").style.display = "block";

  // Load and render Markdown
  try {
    const res = await fetch(`posts/${slug}.md`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md  = await res.text();

    // Remove h1 from body if it matches the title (avoid duplication)
    const clean = md.replace(/^#\s+.+\n/, "");

    // Configure marked
    marked.setOptions({ breaks: false, gfm: true });

    const postBody = document.getElementById("post-body");
    postBody.innerHTML = marked.parse(clean);

    // Fix image paths: .md files live in posts/ but images are relative to site root.
    // Prepend ../ to any src that is not already absolute or root-relative.
    postBody.querySelectorAll("img").forEach(img => {
      const src = img.getAttribute("src");
      if (src && !src.startsWith("http") && !src.startsWith("/") && !src.startsWith("..")) {
        img.setAttribute("src", "../" + src);
      }
    });
    document.getElementById("loading").style.display = "none";

  } catch(e) {
    showError(`Não foi possível carregar o arquivo posts/${slug}.md`);
  }

})();
</script>

</body>
</html>
